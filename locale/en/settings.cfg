[mod-setting-description]
plintorio_spawn_enabled=Disable for vanilla map generation. All other settings will be ignored, except for the ones relating to tree decay.
plintorio_spawn_radius=Number of chunks (32x32 tiles) away from the spawn point to clean in each direction. E.g. a value of 10 will result in a 20x20 chunk area (640x640 tiles) to be cleaned. Note that the protective tree barrier is placed within this, so the safe zone will be slightly smaller.
plintorio_spawn_trees_width=Width of the tree barrier in number of tiles/trees.
plintorio_spawn_change_floor=Enable to replace all floor tiles in the clean zone with the Main tile set below.
plintorio_spawn_tile_main=The floor type to cover the clean zone in. Check the Tile section in "Data.raw" on the Factorio Wiki for supported values.
plintorio_spawn_tile_center=The floor type for a 6x6 area around the center of the safe zone. Check the Tile section in "Data.raw" on the Factorio Wiki for supported values.
plintorio_spawn_keep_water=Enable to leave default water untouched. If disabled, lakes will be replaced with the Main tile set above and you will need to create your own in the map editor, or explore outside the safe zone. If Keep fish is enabled, a few water tiles may remain available to hold them.
plintorio_spawn_keep_fish=Enable to leave default fish untouched. If disabled, you will have to create your own in the map editor, or explore outside the safe zone.
plintorio_spawn_keep_ores=Enable to leave default ore patches untouched. If disabled, you will have to create your own in the map editor, or explore outside the safe zone.
plintorio_spawn_keep_trees=Enable to leave default trees untouched. If disabled, you will have to create your own forests, use up the tree barrier, or explore outside the safe zone.
plintorio_spawn_keep_rocks=Enable to leave default rocks untouched. If disabled, you will have to get all your stone and coal from ore patches or outside the safe zone.
plintorio_spawn_keep_wreck=Enable to leave the crashed spaceship untouched. If disabled, you will not get the starter loot.
plintorio_spawn_destroy_decoratives=Enable to remove all decorative elements like bushes, roots and decal.
plintorio_spawn_decay_interval=Number of minutes between attempts to remove dead trees from the tree barrier.
plintorio_spawn_decay_enabled=Enable to completely remove trees from the protective tree barrier that died from absorbing pollution, creating gaps over time to allow enemies through. Disabling will prevent further thinning of the forest, but will not restore already removed trees.
plintorio_spawn_decay_chance=Percentage of dead trees to remove each cycle. As neighboring trees often die soon after each other, removing them all at once can suddenly create large gaps in the protective barrier. Removing a smaller portion per cycle can make the breakdown more gradual.
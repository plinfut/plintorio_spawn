[mod-setting-description]
plintorio_spawn_clean_size=Preferred width and height of the clean zone, in tiles. The actual size will be rounded up to a multiple of 64 for performance reasons. The protective tree barrier is placed within the clean zone, so the safe zone will be slightly smaller.
plintorio_spawn_replace_terrain=Whether to replace the terrain tiles. If disabled, the "Main tile", "Center tile" and "Replace water?" settings will be ignored.
plintorio_spawn_tile_main=Tile type to cover the entire clean zone with. See the Tile section of "Data.raw" on the Factorio Wiki for possible values.
plintorio_spawn_tile_center=Tile type to mark the center (spawn point) with. See the Tile section of "Data.raw" on the Factorio Wiki for possible values. Can be the same as "Main tile" to not mark the center.
plintorio_spawn_replace_water=Whether to replace water. If disabled, only land tiles will be replaced with "Main tile". If enabled but "Remove fish?" is disabled, tiny puddles of water will be left to hold the fish in. If both "Replace water?" and "Remove fish?" are enabled, you will have to create new lakes in the map editor or explore outside the safe zone for all your water needs.
plintorio_spawn_remove_crash_site=Warning: removing the spaceship will also destroy the items inside.
plintorio_spawn_remove_rocks=Warning: you will not receive the stone and coal you get when mining rocks manually.
plintorio_spawn_remove_trees=Warning: you will not receive the wood you get when chopping trees manually. Does not affect the protective tree barrier.
plintorio_spawn_remove_ores=If enabled, you will have to create new ore patches in the map editor or explore outside the safe zone for all your ore needs.
plintorio_spawn_remove_decoratives=Decoratives are elements that serve no purpose other than making the map look more versatile, such as bushes, roots and decal.
plintorio_spawn_trees_width=Width of the protective tree barrier, in tiles/trees. Can be 0 to only clean the spawn area without safeguarding it.
plintorio_spawn_decay_enabled=Whether to completely remove trees from the barrier when they die from absorbing too much pollution, creating gaps over time. Disabling this will prevent further decay but not restore already removed trees.
plintorio_spawn_decay_interval=Seconds between removing dead trees. Effect highly depends on "Barrier decay chance".
plintorio_spawn_decay_damage=Minimum total damage to trees required to qualify for removal. Each time trees absorb pollution, there is a chance for them to lose 25% of their leaves or turn ~6% more gray, up to 120% in total. Important note: damage grows quickly at first and slows down later, so it takes a lot longer to go from 100% to 120% than it takes to go from 0% to 80%.
plintorio_spawn_decay_chance=Percentage of dead trees to remove each cycle. As neighboring trees often die soon after each other, removing all dead trees at once can very suddenly create large gaps in the protective barrier. Removing a smaller portion per cycle makes protection decay more gradual. Decreasing this value also slows down barrier decay, but that can be offset by decreasing "Barrier decay interval" by the same factor.
